name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *" # Runs once daily at midnight
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true
          path: profile/stats.svg
          token: ${{ secrets.GH_STATS_TOKEN }}

      - name: Generate top languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate pin card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: pin
          options: username=readme-tools&repo=github-readme-stats
          path: profile/pin-readme-tools-github-readme-stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate stats card
        run: |
          python3 - <<'PY'
          import re
          import xml.etree.ElementTree as ET
          
          root = ET.parse("profile/stats.svg").getroot()
          if root.tag != "{http://www.w3.org/2000/svg}svg":
              raise SystemExit("Stats card is not a valid SVG.")
          if root.find(".//*[@data-testid='message']") is not None:
              raise SystemExit("Stats card contains an API error; refusing to commit.")
          for metric in ("stars", "commits", "prs", "issues", "contribs"):
              node = root.find(f".//*[@data-testid='{metric}']")
              value = "" if node is None else "".join(node.itertext()).strip()
              if not re.fullmatch(r"[0-9]+(?:[.,][0-9]+)*[kmbt]?", value, re.IGNORECASE):
                  raise SystemExit(f"Stats card is missing a valid {metric} count.")
          print("Stats card validation passed.")
          PY

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
